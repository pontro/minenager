services:
  postgres:
    image: postgres:16-alpine
    container_name: minenager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minenager
      POSTGRES_PASSWORD: minenager_dev_password
      POSTGRES_DB: minenager_cloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minenager -d minenager_cloud"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
