services:
  postgres:
    image: postgres:16-alpine
    container_name: minenager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minenager
      POSTGRES_PASSWORD: minenager_dev_password
      POSTGRES_DB: minenager_cloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minenager -d minenager_cloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: minenager-cloud-api
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://minenager:minenager_dev_password@postgres:5432/minenager_cloud
      - JWT_SECRET=dev_jwt_secret_key_minenager_vps_32bytes_min!
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=43200
    env_file:
      - .env
    volumes:
      - ./app:/code/app
    depends_on:
      postgres:
        condition: service_healthy

  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    container_name: minenager-cloud-relay
    restart: unless-stopped
    ports:
      - "2333:2333"
      - "2333:2333/udp"
      - "25566:25566"
      - "25567:25567"
      - "25568:25568"

volumes:
  pgdata:


