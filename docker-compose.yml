services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "25565:25565"
    volumes:
      - ./data:/data
      - ./app:/code/app
      - .:/repo
    environment:
      - PYTHONUNBUFFERED=1
      - CLOUD_API_URL=http://host.docker.internal:8080/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"

